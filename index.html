<title>キクタン身のまわり編</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--fg:#1f2430;--sub:#6b7280;--pri:#2563eb;--ok:#16a34a;--ng:#dc2626;--line:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#12141a;--card:#1c1f28;--fg:#e8eaf0;--sub:#9aa1b0;--pri:#5b8cff;--ok:#34d399;--ng:#f87171;--line:#2b303c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.5}
#app{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
h1{font-size:20px;margin:4px 0 14px}
.bar{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin-bottom:8px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--pri)}
.word{font-size:36px;font-weight:700;text-align:center;margin:18px 0;word-break:break-word}
.mean{font-size:20px;text-align:center;margin:8px 0 14px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:14px 16px;width:100%;margin-top:10px;font-size:16px;text-align:left}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri);text-align:center;font-weight:700}
button.c{text-align:center}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
button.ng{background:var(--ng);color:#fff;border-color:var(--ng)}
button.dk{color:var(--sub);text-align:center}
button:disabled{opacity:.9;cursor:default}
.row{display:flex;gap:10px}.row button{flex:1}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.sub{color:var(--sub);font-size:13px}
.list div{padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.big{font-size:44px;font-weight:800;text-align:center}
.small-btn{width:auto;padding:6px 12px;font-size:13px;margin:0}
</style>
</head>

const BATCH=20, KEY='kikutan-migawari-v1';
const byId=new Map(WORDS.map(w=>[w[0],w]));
const ALL_IDS=WORDS.map(w=>w[0]);
const $=document.getElementById('app');

let S=load();
function fresh(){return{lap:1,cands:ALL_IDS.slice(),pos:0,pool:[],thisUnknown:[],known:[],stats:{c:0,t:0},phase:'home',idx:0,order:[],answers:[],tq:null}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.lap){if(!s.known){
  const all=new Set(s.cands);
  s.known=s.lap===1?s.cands.slice(0,s.pos).filter(i=>!s.thisUnknown.includes(i)&&!s.pool.includes(i)):ALL_IDS.filter(i=>!all.has(i));
}return s}}catch(e){}return fresh()}
const candsFor=()=>{const k=new Set(S.known),c=ALL_IDS.filter(i=>!k.has(i));return c.length?c:ALL_IDS.slice()};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function speak(t){
  if(!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}catch(e){}
}
function header(label,i,n){
  return `<div class="bar"><span>${label}</span><span>${i} / ${n}</span></div><div class="prog"><i style="width:${n?i/n*100:0}%"></i></div>`;
}

/* ---------- 画面 ---------- */
function render(){
  ({home,screen:rScreen,study:rStudy,test:rTest,result:rResult}[S.phase]||home)();
  window.scrollTo(0,0);
}

function home(){
  const acc=S.stats.t?Math.round(S.stats.c/S.stats.t*100):0;
  const started=S.pos>0||S.pool.length>0||S.lap>1;
  $.innerHTML=`<h1>キクタン身のまわり編</h1>
  <div class="card">
    <div class="stat"><span>周回</span><b>${S.lap}周目</b></div>
    <div class="stat"><span>選別の位置</span><b>${Math.min(S.pos,S.cands.length)} / ${S.cands.length}語</b></div>
    <div class="stat"><span>最初から知っている語（1周目で判定）</span><b>${S.known.length}語</b></div>
    <div class="stat"><span>復習待ちの語</span><b>${S.pool.length}語</b></div>
    <div class="stat"><span>累積正答率</span><b>${acc}%（${S.stats.c}/${S.stats.t}）</b></div>
  </div>
  <button class="pri" id="go">${started?'続きから':'はじめる'}</button>
  <button class="dk" id="resetKnown" ${S.known.length?'':'disabled'}>「知ってる」の分類だけリセット</button>
  <button class="dk" id="reset">進捗をリセット</button>`;
  document.getElementById('go').onclick=()=>{S.phase='screen';save();render()};
  document.getElementById('resetKnown').onclick=()=>{
    if(!confirm('「知っている」に分類した'+S.known.length+'語を元に戻し、再び出題対象にしますか？（周回・進捗は保持）'))return;
    const cur=S.cands[S.pos];S.known=[];S.cands=ALL_IDS.slice();
    S.pos=cur===undefined?S.cands.length:S.cands.filter(i=>i<cur).length;
    save();render();
  };
  document.getElementById('reset').onclick=()=>{if(confirm('進捗をすべて消してよいですか？')){S=fresh();save();render()}};
}

function rScreen(){
  if(S.pool.length>=BATCH||S.pos>=S.cands.length)return endScreen();
  const w=byId.get(S.cands[S.pos]);
  $.innerHTML=header(`${S.lap}周目・選別（分からない語 ${S.pool.length}/${BATCH}）`,S.pos+1,S.cands.length)+
  `<div class="card"><div class="word">${esc(w[1])}</div>
   <button class="c" id="pl">🔊 発音</button></div>
   <div class="row"><button class="c pri" id="know">知ってる</button><button class="c ng" id="dk">分からない</button></div>
   <button class="dk" id="home">中断してホームへ</button>`;
  document.getElementById('pl').onclick=()=>speak(w[1]);
  document.getElementById('know').onclick=()=>{if(S.lap===1&&!S.known.includes(w[0]))S.known.push(w[0]);S.pos++;save();render()};
  document.getElementById('dk').onclick=()=>{
    if(!S.pool.includes(w[0]))S.pool.push(w[0]);
    if(!S.thisUnknown.includes(w[0]))S.thisUnknown.push(w[0]);
    S.pos++;save();render();
  };
  document.getElementById('home').onclick=()=>{S.phase='home';save();render()};
}

function endScreen(){
  if(S.pool.length===0){advanceLapIfDone();S.phase='home';save();return render()}
  S.phase='study';S.idx=0;S.batch=S.pool.slice(0,BATCH);S.order=S.batch.slice();save();render();
}

function rStudy(){
  const id=S.order[S.idx],w=byId.get(id),n=S.order.length;
  $.innerHTML=header('学習モード',S.idx+1,n)+
  `<div class="card"><div class="word">${esc(w[1])}</div><div class="mean">${esc(w[2])}</div>
   <button class="c" id="pl">🔊 もう一度聞く</button>
   <button class="c dk" id="mute">${S.mute?'🔇 自動音声：オフ（タップでオンに）':'🔊 自動音声：オン（タップでオフに）'}</button></div>
   <div class="row"><button class="c" id="prev" ${S.idx?'':'disabled'}>← 前へ</button>
   <button class="c pri" id="next">${S.idx===n-1?'テストへ':'次へ →'}</button></div>
   <button class="dk" id="redo" ${S.idx?'':'disabled'}>↺ 学習を最初からやり直す</button>`;
  if(!S.mute)speak(w[1]);
  document.getElementById('pl').onclick=()=>speak(w[1]);
  document.getElementById('mute').onclick=()=>{S.mute=!S.mute;if(S.mute&&'speechSynthesis' in window)speechSynthesis.cancel();save();render()};
  document.getElementById('redo').onclick=()=>{S.idx=0;save();render()};
  document.getElementById('prev').onclick=()=>{S.idx--;save();render()};
  document.getElementById('next').onclick=()=>{
    if(S.idx===n-1){S.phase='test';S.idx=0;S.order=shuffle(S.batch);S.answers=[];S.tq=null;}
    else S.idx++;
    save();render();
  };
}

/* 選択肢生成: 意味の書き出しが同じ型で、番号が近い語を優先 */
function kind(m){const t=m.replace(/^[～〜]/,'');return (m[0]==='～'||m[0]==='〜'?'~':'')+t.slice(0,1)+(/す?る/.test(m.slice(-3))?'v':'')}
function makeChoices(id){
  const w=byId.get(id),k=kind(w[2]);
  const others=ALL_IDS.filter(i=>i!==id&&byId.get(i)[2]!==w[2]);
  const score=i=>{const same=kind(byId.get(i)[2])===k?0:1;return same*10000+Math.abs(i-id)+Math.random()*40};
  const near=others.map(i=>[score(i),i]).sort((a,b)=>a[0]-b[0]).slice(0,12).map(x=>x[1]);
  const picks=shuffle(near).slice(0,3);
  return shuffle([id,...picks]);
}

function rTest(){
  const n=S.order.length;
  if(S.idx>=n)return finishTest();
  const id=S.order[S.idx],w=byId.get(id);
  if(!S.tq||S.tq.id!==id){S.tq={id,ch:makeChoices(id),sel:null};save()}
  const q=S.tq,done=q.sel!==null;
  let btns=q.ch.map(c=>{
    let cls='';if(done){if(c===id)cls='ok';else if(c===q.sel)cls='ng'}
    return `<button class="${cls}" data-id="${c}" ${done?'disabled':''}>${esc(byId.get(c)[2])}</button>`;
  }).join('');
  btns+=`<button class="dk ${done&&q.sel===0?'ng':''}" data-id="0" ${done?'disabled':''}>分からない</button>`;
  $.innerHTML=header('テスト',S.idx+1,n)+
  `<div class="card"><div class="word">${esc(w[1])}</div>
   <div style="text-align:center"><button class="small-btn c" id="pl">🔊</button></div></div>${btns}`+
  (done?`<button class="pri" id="next">${S.idx===n-1?'結果を見る':'次へ →'}</button>`:'');
  document.getElementById('pl').onclick=()=>speak(w[1]);
  $.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{
    q.sel=+b.dataset.id;S.answers.push({id,ok:q.sel===id});save();render();
  });
  if(done)document.getElementById('next').onclick=()=>{S.idx++;S.tq=null;save();render()};
}

function finishTest(){
  const ok=S.answers.filter(a=>a.ok).length;
  S.stats.c+=ok;S.stats.t+=S.answers.length;
  S.pool=S.answers.filter(a=>!a.ok).map(a=>a.id).concat(S.pool.filter(i=>!S.batch.includes(i)));
  S.lastScore={ok,n:S.answers.length};
  S.phase='result';save();render();
}

function rResult(){
  const {ok,n}=S.lastScore,wrong=S.answers.filter(a=>!a.ok).map(a=>a.id);
  const finished=S.pos>=S.cands.length;
  $.innerHTML=`<h1>テスト結果</h1><div class="card"><div class="big">${ok} / ${n}</div>
  <div class="sub" style="text-align:center">正答率 ${n?Math.round(ok/n*100):0}%</div></div>
  ${wrong.length?`<div class="card"><b>間違い・分からなかった語（${wrong.length}語）</b><div class="list">${
    wrong.map(i=>{const w=byId.get(i);return `<div><b>${esc(w[1])}</b>　${esc(w[2])}</div>`}).join('')}</div>
    <div class="sub" style="margin-top:8px">次のラウンドの${BATCH}語に含まれます。</div></div>`:''}
  <button class="pri" id="next">${finished&&!S.pool.length?'次の周へ':'次の単語を選ぶ'}</button>`;
  document.getElementById('next').onclick=()=>{
    advanceLapIfDone();
    S.phase='screen';save();render();
  };
}

/* 選別対象を最後まで見終わり、持ち越しも無ければ次の周へ */
function advanceLapIfDone(){
  if(S.pos<S.cands.length||S.pool.length>0)return;
  S.lap++;
  S.cands=candsFor();
  S.thisUnknown=[];S.pos=0;
}

render();
</script>
